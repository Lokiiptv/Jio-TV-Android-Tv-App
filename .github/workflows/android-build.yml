name: Build JioTV+ Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.dart'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          java -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-pub
        continue-on-error: true

      - name: Run tests
        run: flutter test --no-pub
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk JioTV-AndroidTV-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JioTV-AndroidTV-release
          path: JioTV-AndroidTV-release.apk
          if-no-files-found: error
          retention-days: 14
